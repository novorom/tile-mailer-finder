name: Spain Job Mailer (Канал 4)

on:
  schedule:
    # Запуск каждый день в 7:00 UTC (10:00 МСК)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  mailer:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Рассылка резюме в Испанию
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          BREVO_USER: ${{ secrets.BREVO_USER_4 }}
          BREVO_PASS: ${{ secrets.BREVO_PASS_4 }}
          MAILER_INDEX: 0
          TOTAL_MAILERS: 1
        run: python spain-mailer.py
