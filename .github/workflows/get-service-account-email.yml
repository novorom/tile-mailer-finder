name: Get Service Account Email

on:
  workflow_dispatch:

jobs:
  get-email:
    runs-on: ubuntu-latest
    steps:
      - name: Extract service account email
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          echo "Service Account Email:"
          echo "$GOOGLE_CREDS" | python3 -c "import sys, json; print(json.load(sys.stdin)['client_email'])"
