name: Check Brevo Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check all Brevo secrets
        env:
          BREVO_USER_1: ${{ secrets.BREVO_USER_1 || secrets.BREVO_USER }}
          BREVO_PASS_1: ${{ secrets.BREVO_PASS_1 || secrets.BREVO_PASS }}
          BREVO_USER_2: ${{ secrets.BREVO_USER_2 }}
          BREVO_PASS_2: ${{ secrets.BREVO_PASS_2 }}
          BREVO_USER_3: ${{ secrets.BREVO_USER_3 }}
          BREVO_PASS_3: ${{ secrets.BREVO_PASS_3 }}
          BREVO_USER_4: ${{ secrets.BREVO_USER_4 }}
          BREVO_PASS_4: ${{ secrets.BREVO_PASS_4 }}
        run: |
          echo "BREVO_USER_1: $BREVO_USER_1"
          echo "BREVO_PASS_1: ${BREVO_PASS_1:0:5}..."
          echo "BREVO_USER_2: $BREVO_USER_2"
          echo "BREVO_PASS_2: ${BREVO_PASS_2:0:5}..."
          echo "BREVO_USER_3: $BREVO_USER_3"
          echo "BREVO_PASS_3: ${BREVO_PASS_3:0:5}..."
          echo "BREVO_USER_4: $BREVO_USER_4"
          echo "BREVO_PASS_4: ${BREVO_PASS_4:0:5}..."
