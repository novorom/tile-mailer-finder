name: America Remote Job Mailer (Канал 3)

on:
  schedule:
    # Запуск каждый будний день в 11:00 UTC (14:00 МСК)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  mailer:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Рассылка резюме в США
        env:
          SPAIN_SHEET_ID: ${{ secrets.SPAIN_SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          BREVO_USER: ${{ secrets.BREVO_USER_3 }}
          BREVO_PASS: ${{ secrets.BREVO_PASS_3 }}
          MAILER_INDEX: 0
          TOTAL_MAILERS: 1
        run: python america-mailer.py
