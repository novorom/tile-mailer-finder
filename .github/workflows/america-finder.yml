name: America Remote Job Finder

on:
  schedule:
    - cron: '0 6 * * *'  # Каждый день в 2:00 AM EDT (6:00 UTC)
  workflow_dispatch:

jobs:
  finder:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Поиск удаленной работы в США
        env:
          SPAIN_SHEET_ID: ${{ secrets.SPAIN_SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: python america-finder.py
