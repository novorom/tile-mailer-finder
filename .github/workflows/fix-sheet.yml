name: Fix Sheet Statuses

on:
  workflow_dispatch:
    inputs:
      reset_month:
        description: 'Month to reset (e.g., 2026-07)'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install gspread google-api-python-client requests beautifulsoup4
      
      - name: Fix empty statuses
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python fix_sheet.py
      
      - name: Reset month status
        if: github.event.inputs.reset_month != ''
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          RESET_MONTH: ${{ github.event.inputs.reset_month }}
        run: python -c "
import os, json, time, logging, requests, socket, gspread
from google.oauth2.service_account import Credentials

logging.basicConfig(level=logging.INFO)
log = logging.getLogger(__name__)

def retry_gspread_call(func, *args, max_retries=5, initial_delay=2, backoff_factor=2, **kwargs):
    import random
    delay = initial_delay
    for attempt in range(max_retries):
        try:
            return func(*args, **kwargs)
        except gspread.exceptions.APIError as ex:
            code = ex.code
            is_transient = code in [429, 500, 502, 503, 504]
            if not is_transient or attempt == max_retries - 1:
                raise ex
            jitter = random.uniform(0.5, 1.5)
            sleep_time = delay * jitter
            log.warning(f'API error [{code}]: {ex.message}. Retry {attempt+1}/{max_retries} in {sleep_time:.2f}s')
            time.sleep(sleep_time)
            delay *= backoff_factor
        except (requests.exceptions.RequestException, socket.error) as ex:
            if attempt == max_retries - 1:
                raise ex
            jitter = random.uniform(0.5, 1.5)
            sleep_time = delay * jitter
            log.warning(f'Network error: {ex}. Retry {attempt+1}/{max_retries} in {sleep_time:.2f}s')
            time.sleep(sleep_time)
            delay *= backoff_factor

creds_dict = json.loads(os.environ['GOOGLE_CREDS'])
credentials = Credentials.from_service_account_info(creds_dict, scopes=['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive'])
gc = gspread.authorize(credentials)
sheet = retry_gspread_call(lambda: gc.open_by_key(os.environ['SHEET_ID']).sheet1)

all_rows = retry_gspread_call(sheet.get_all_values)
records = {}
for row_num, row in enumerate(all_rows, start=1):
    if not row or not row[0].strip():
        continue
    email = row[0].strip().lower()
    if email == 'email':
        continue
    status_val = row[1].strip().lower() if len(row) > 1 else ''
    status = status_val if 'dead' in status_val else 'active'
    sent = row[2].strip() if len(row) > 2 else ''
    records[email] = {'row': row_num, 'status': status, 'sent': sent}

month = os.environ['RESET_MONTH']
log.info(f'Resetting status for month {month}...')
updates = []
for email, meta in records.items():
    if meta['sent'] == month:
        updates.append({'range': f'C{meta[\"row\"]}', 'values': [['']]})
if updates:
    retry_gspread_call(sheet.batch_update, updates)
log.info(f'Reset {len(updates)} statuses for {month}')
"
