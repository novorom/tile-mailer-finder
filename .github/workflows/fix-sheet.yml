name: Fix Sheet Statuses

on:
  workflow_dispatch:
    inputs:
      reset_month:
        description: 'Month to reset (e.g., 2026-07)'
        required: false
        default: ''

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install gspread google-api-python-client requests beautifulsoup4
      
      - name: Fix empty statuses
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: python fix_sheet.py
      
      - name: Reset month status
        if: github.event.inputs.reset_month != ''
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          RESET_MONTH: ${{ github.event.inputs.reset_month }}
        run: python mailer-agent.py --reset-month $RESET_MONTH
